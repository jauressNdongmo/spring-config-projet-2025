spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: client
          uri: http://localhost:8078
          predicates:
            - Path=/client/**

        - id: order
          uri: http://localhost:8082
          predicates:
            - Path=/order/**

        - id: product
          uri: http://localhost:8083
          predicates:
            - Path=/product/**

        - id: eureka-server
          uri: http://localhost:8090
          predicates:
            - Path=/eureka-server/**