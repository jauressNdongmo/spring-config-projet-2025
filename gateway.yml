server:
  port: 8081
spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: default-root
          uri: http://localhost:8070
          predicates:
            - Path=/
        - id: users
          uri: lb://USERS
          predicates:
            - Path=/users/**

        - id: notifications
          uri: lb://NOTIFICATIONs
          predicates:
            - Path=/notifications/**

        - id: documents
          uri: lb://DOCUMENTS
          predicates:
            - Path=/documents/**

        - id: docGeneration
          uri: lb://DOCGENERATION
          predicates:
            - Path=/docGeneration/**

        - id: config-server
          uri: lb://CONFIGSERVER
          predicates:
            - Path=/config/**

        - id: eureka-server
          uri: http://localhost:8090
          predicates:
            - Path=/eureka-server/**